{% extends 'tracker/base.html' %}

{% block title %}Budgets - Finance Tracker{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="mb-0">Budgets</h4>
    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#budgetModal">
        <i class="bi bi-plus-lg me-1"></i> Add Budget
    </button>
</div>

<div class="row g-4" id="budgetCards">
    <div class="col-12 text-center py-5 text-muted">Loading...</div>
</div>

<div class="modal fade" id="budgetModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalTitle">Add Budget</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="budgetForm">
                    <input type="hidden" id="budgetId">
                    <div class="mb-3">
                        <label for="category" class="form-label">Category</label>
                        <select class="form-select" id="category" required>
                            <option value="">Select category</option>
                            {% for cat in categories %}
                            <option value="{{ cat.id }}">{{ cat.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="amount" class="form-label">Budget Amount</label>
                        <div class="input-group">
                            <span class="input-group-text">$</span>
                            <input type="number" class="form-control" id="amount" step="0.01" min="0" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="period" class="form-label">Period</label>
                        <select class="form-select" id="period" required>
                            <option value="weekly">Weekly</option>
                            <option value="monthly" selected>Monthly</option>
                            <option value="yearly">Yearly</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="saveBudget()">Save</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
const modal = new bootstrap.Modal(document.getElementById('budgetModal'));

async function loadBudgets() {
    try {
        const budgets = await apiRequest('/api/budgets/');
        const container = document.getElementById('budgetCards');
        
        if (budgets.length === 0) {
            container.innerHTML = `
                <div class="col-12 text-center py-5">
                    <i class="bi bi-pie-chart text-muted" style="font-size: 4rem;"></i>
                    <h5 class="mt-3 text-muted">No Budgets Yet</h5>
                    <p class="text-muted">Create a budget to track your spending limits</p>
                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#budgetModal">
                        <i class="bi bi-plus-lg me-1"></i> Create Budget
                    </button>
                </div>
            `;
            return;
        }
        
        container.innerHTML = budgets.map(b => `
            <div class="col-md-6 col-lg-4">
                <div class="card h-100">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-start mb-3">
                            <div>
                                <h5 class="mb-1" style="color: ${b.category.color}">${escapeHtml(b.category.name)}</h5>
                                <small class="text-muted text-capitalize">${b.period}</small>
                            </div>
                            <div class="dropdown">
                                <button class="btn btn-link text-muted p-0" data-bs-toggle="dropdown">
                                    <i class="bi bi-three-dots-vertical"></i>
                                </button>
                                <ul class="dropdown-menu dropdown-menu-end">
                                    <li><a class="dropdown-item" href="#" onclick="editBudget(${b.id}, ${b.category.id}, '${b.amount}', '${b.period}')">Edit</a></li>
                                    <li><a class="dropdown-item text-danger" href="#" onclick="deleteBudget(${b.id})">Delete</a></li>
                                </ul>
                            </div>
                        </div>
                        
                        <div class="mb-2">
                            <div class="d-flex justify-content-between mb-1">
                                <span class="fw-medium">${formatCurrency(b.spent)}</span>
                                <span class="text-muted">of ${formatCurrency(b.amount)}</span>
                            </div>
                            <div class="progress" style="height: 10px;">
                                <div class="progress-bar ${b.percentage >= 100 ? 'bg-danger' : b.percentage >= 80 ? 'bg-warning' : 'bg-success'}" 
                                     style="width: ${b.percentage}%"></div>
                            </div>
                        </div>
                        
                        <div class="d-flex justify-content-between text-muted small">
                            <span>${b.percentage}% used</span>
                            <span class="${parseFloat(b.amount) - parseFloat(b.spent) < 0 ? 'text-danger' : 'text-success'}">
                                ${parseFloat(b.amount) - parseFloat(b.spent) >= 0 ? formatCurrency(parseFloat(b.amount) - parseFloat(b.spent)) + ' left' : formatCurrency(Math.abs(parseFloat(b.amount) - parseFloat(b.spent))) + ' over'}
                            </span>
                        </div>
                    </div>
                </div>
            </div>
        `).join('');
    } catch (error) {
        console.error('Error loading budgets:', error);
    }
}

function resetForm() {
    document.getElementById('budgetId').value = '';
    document.getElementById('budgetForm').reset();
    document.getElementById('modalTitle').textContent = 'Add Budget';
}

document.getElementById('budgetModal').addEventListener('show.bs.modal', (e) => {
    if (e.relatedTarget) resetForm();
});

function editBudget(id, categoryId, amount, period) {
    document.getElementById('budgetId').value = id;
    document.getElementById('modalTitle').textContent = 'Edit Budget';
    document.getElementById('category').value = categoryId;
    document.getElementById('amount').value = amount;
    document.getElementById('period').value = period;
    modal.show();
}

async function saveBudget() {
    const id = document.getElementById('budgetId').value;
    const data = {
        category_id: document.getElementById('category').value,
        amount: document.getElementById('amount').value,
        period: document.getElementById('period').value
    };
    
    try {
        if (id) {
            await apiRequest(`/api/budgets/${id}/`, 'PUT', data);
        } else {
            await apiRequest('/api/budgets/', 'POST', data);
        }
        modal.hide();
        loadBudgets();
    } catch (error) {
        console.error('Error saving budget:', error);
        alert('Error saving budget');
    }
}

async function deleteBudget(id) {
    if (!confirm('Are you sure you want to delete this budget?')) return;
    
    try {
        await apiRequest(`/api/budgets/${id}/`, 'DELETE');
        loadBudgets();
    } catch (error) {
        console.error('Error deleting budget:', error);
    }
}

function formatCurrency(amount) {
    return new Intl.NumberFormat('en-US', {
        style: 'currency',
        currency: 'USD'
    }).format(parseFloat(amount));
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

loadBudgets();
</script>
{% endblock %}
