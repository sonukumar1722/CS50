{% extends "encyclopedia/layout.html" %}

{% block title %}
    Encyclopedia
{% endblock %}

{% block body %}
    <h1>All Pages</h1>

    <ul id="entries-list">
        {% for entry in entries %}
            <li class="entry-item"><a href="{% url 'edit_page' entry %}">{{ entry }}</a></li>
        {% endfor %}
    </ul>

{% endblock %}

{% block nav %}
    {% load static %}
    <script src="{% static 'encyclopedia/search.js' %}"></script>
{% endblock %}
