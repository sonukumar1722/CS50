{% extends 'tracker/base.html' %}

{% block title %}Transactions - Finance Tracker{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
    <h4 class="mb-0">Transactions</h4>
    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#transactionModal">
        <i class="bi bi-plus-lg me-1"></i> Add Transaction
    </button>
</div>

<div class="card mb-4">
    <div class="card-body">
        <div class="row g-3">
            <div class="col-md-3">
                <input type="text" class="form-control" id="searchInput" placeholder="Search transactions...">
            </div>
            <div class="col-md-2">
                <select class="form-select" id="typeFilter">
                    <option value="">All Types</option>
                    <option value="income">Income</option>
                    <option value="expense">Expense</option>
                </select>
            </div>
            <div class="col-md-2">
                <select class="form-select" id="categoryFilter">
                    <option value="">All Categories</option>
                    {% for cat in categories %}
                    <option value="{{ cat.id }}">{{ cat.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-2">
                <input type="date" class="form-control" id="startDate">
            </div>
            <div class="col-md-2">
                <input type="date" class="form-control" id="endDate">
            </div>
            <div class="col-md-1">
                <button class="btn btn-outline-secondary w-100" onclick="clearFilters()">
                    <i class="bi bi-x-lg"></i>
                </button>
            </div>
        </div>
    </div>
</div>

<div class="card">
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th>Date</th>
                        <th>Description</th>
                        <th>Category</th>
                        <th>Type</th>
                        <th class="text-end">Amount</th>
                        <th class="text-end">Actions</th>
                    </tr>
                </thead>
                <tbody id="transactionsTable">
                    <tr><td colspan="6" class="text-center py-4 text-muted">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div class="modal fade" id="transactionModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalTitle">Add Transaction</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="transactionForm">
                    <input type="hidden" id="transactionId">
                    <div class="mb-3">
                        <label class="form-label">Type</label>
                        <div class="btn-group w-100" role="group">
                            <input type="radio" class="btn-check" name="transType" id="typeExpense" value="expense" checked>
                            <label class="btn btn-outline-danger" for="typeExpense">Expense</label>
                            <input type="radio" class="btn-check" name="transType" id="typeIncome" value="income">
                            <label class="btn btn-outline-success" for="typeIncome">Income</label>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="amount" class="form-label">Amount</label>
                        <div class="input-group">
                            <span class="input-group-text">$</span>
                            <input type="number" class="form-control" id="amount" step="0.01" min="0" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="description" class="form-label">Description</label>
                        <input type="text" class="form-control" id="description" required>
                    </div>
                    <div class="mb-3">
                        <label for="category" class="form-label">Category</label>
                        <select class="form-select" id="category">
                            <option value="">Select category</option>
                            {% for cat in categories %}
                            <option value="{{ cat.id }}" data-type="{{ cat.category_type }}">{{ cat.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="date" class="form-label">Date</label>
                        <input type="date" class="form-control" id="date" required>
                    </div>
                    <div class="mb-3">
                        <label for="notes" class="form-label">Notes (optional)</label>
                        <textarea class="form-control" id="notes" rows="2"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="saveTransaction()">Save</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
const modal = new bootstrap.Modal(document.getElementById('transactionModal'));

document.getElementById('date').valueAsDate = new Date();

document.querySelectorAll('input[name="transType"]').forEach(input => {
    input.addEventListener('change', filterCategoryOptions);
});

function filterCategoryOptions() {
    const type = document.querySelector('input[name="transType"]:checked').value;
    const categorySelect = document.getElementById('category');
    const options = categorySelect.querySelectorAll('option');
    
    options.forEach(opt => {
        if (!opt.value) return;
        opt.style.display = opt.dataset.type === type ? '' : 'none';
    });
    
    if (categorySelect.selectedOptions[0]?.dataset.type !== type) {
        categorySelect.value = '';
    }
}

filterCategoryOptions();

['searchInput', 'typeFilter', 'categoryFilter', 'startDate', 'endDate'].forEach(id => {
    document.getElementById(id).addEventListener('change', loadTransactions);
    if (id === 'searchInput') {
        document.getElementById(id).addEventListener('keyup', debounce(loadTransactions, 300));
    }
});

function debounce(func, wait) {
    let timeout;
    return function(...args) {
        clearTimeout(timeout);
        timeout = setTimeout(() => func.apply(this, args), wait);
    };
}

async function loadTransactions() {
    const params = new URLSearchParams();
    const search = document.getElementById('searchInput').value;
    const type = document.getElementById('typeFilter').value;
    const category = document.getElementById('categoryFilter').value;
    const startDate = document.getElementById('startDate').value;
    const endDate = document.getElementById('endDate').value;
    
    if (search) params.append('search', search);
    if (type) params.append('type', type);
    if (category) params.append('category', category);
    if (startDate) params.append('start_date', startDate);
    if (endDate) params.append('end_date', endDate);
    
    try {
        const transactions = await apiRequest(`/api/transactions/?${params}`);
        const tbody = document.getElementById('transactionsTable');
        
        if (transactions.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" class="text-center py-4 text-muted">No transactions found</td></tr>';
            return;
        }
        
        tbody.innerHTML = transactions.map(t => `
            <tr>
                <td>${formatDate(t.date)}</td>
                <td>
                    <div class="fw-medium">${escapeHtml(t.description)}</div>
                    ${t.notes ? `<small class="text-muted">${escapeHtml(t.notes)}</small>` : ''}
                </td>
                <td>
                    ${t.category ? `<span class="badge" style="background-color: ${t.category.color}">${escapeHtml(t.category.name)}</span>` : '<span class="text-muted">-</span>'}
                </td>
                <td>
                    <span class="badge ${t.transaction_type === 'income' ? 'badge-income' : 'badge-expense'}">
                        ${t.transaction_type}
                    </span>
                </td>
                <td class="text-end fw-medium ${t.transaction_type === 'income' ? 'text-success' : 'text-danger'}">
                    ${t.transaction_type === 'income' ? '+' : '-'}${formatCurrency(t.amount)}
                </td>
                <td class="text-end">
                    <button class="btn btn-sm btn-outline-primary me-1" onclick="editTransaction(${t.id})">
                        <i class="bi bi-pencil"></i>
                    </button>
                    <button class="btn btn-sm btn-outline-danger" onclick="deleteTransaction(${t.id})">
                        <i class="bi bi-trash"></i>
                    </button>
                </td>
            </tr>
        `).join('');
    } catch (error) {
        console.error('Error loading transactions:', error);
    }
}

function clearFilters() {
    document.getElementById('searchInput').value = '';
    document.getElementById('typeFilter').value = '';
    document.getElementById('categoryFilter').value = '';
    document.getElementById('startDate').value = '';
    document.getElementById('endDate').value = '';
    loadTransactions();
}

function resetForm() {
    document.getElementById('transactionId').value = '';
    document.getElementById('transactionForm').reset();
    document.getElementById('typeExpense').checked = true;
    document.getElementById('date').valueAsDate = new Date();
    document.getElementById('modalTitle').textContent = 'Add Transaction';
    filterCategoryOptions();
}

document.getElementById('transactionModal').addEventListener('show.bs.modal', (e) => {
    if (e.relatedTarget) resetForm();
});

async function editTransaction(id) {
    const transactions = await apiRequest('/api/transactions/');
    const t = transactions.find(tr => tr.id === id);
    if (!t) return;
    
    document.getElementById('transactionId').value = id;
    document.getElementById('modalTitle').textContent = 'Edit Transaction';
    document.getElementById('amount').value = t.amount;
    document.getElementById('description').value = t.description;
    document.getElementById('date').value = t.date;
    document.getElementById('notes').value = t.notes;
    
    if (t.transaction_type === 'income') {
        document.getElementById('typeIncome').checked = true;
    } else {
        document.getElementById('typeExpense').checked = true;
    }
    filterCategoryOptions();
    
    if (t.category) {
        document.getElementById('category').value = t.category.id;
    }
    
    modal.show();
}

async function saveTransaction() {
    const id = document.getElementById('transactionId').value;
    const data = {
        transaction_type: document.querySelector('input[name="transType"]:checked').value,
        amount: document.getElementById('amount').value,
        description: document.getElementById('description').value,
        category_id: document.getElementById('category').value || null,
        date: document.getElementById('date').value,
        notes: document.getElementById('notes').value
    };
    
    try {
        if (id) {
            await apiRequest(`/api/transactions/${id}/`, 'PUT', data);
        } else {
            await apiRequest('/api/transactions/', 'POST', data);
        }
        modal.hide();
        loadTransactions();
    } catch (error) {
        console.error('Error saving transaction:', error);
        alert('Error saving transaction');
    }
}

async function deleteTransaction(id) {
    if (!confirm('Are you sure you want to delete this transaction?')) return;
    
    try {
        await apiRequest(`/api/transactions/${id}/`, 'DELETE');
        loadTransactions();
    } catch (error) {
        console.error('Error deleting transaction:', error);
    }
}

function formatCurrency(amount) {
    return new Intl.NumberFormat('en-US', {
        style: 'currency',
        currency: 'USD'
    }).format(parseFloat(amount));
}

function formatDate(dateStr) {
    return new Date(dateStr).toLocaleDateString('en-US', {
        year: 'numeric',
        month: 'short',
        day: 'numeric'
    });
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

loadTransactions();
</script>
{% endblock %}
